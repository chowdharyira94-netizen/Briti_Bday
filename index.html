<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Britikaa 💗</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffc4e3, #e6a4ed, #ffd5e9);
    overflow-x: hidden;
    color: white;
}

.page {
    position: relative;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    overflow: hidden;
}

/* REALISTIC GIFT ARTWORK */

.gift-scene {
    position: relative;
    width: min(100%, 600px);
    aspect-ratio: 3 / 4;
    max-height: 86svh;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 15px 50px #9e387b40;
    animation: sceneAppear 1.2s ease both;
}

.gift-art {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    transition:
        transform 1.2s cubic-bezier(.2,.8,.2,1),
        filter 1s ease,
        opacity 1s ease;
}

/* CLICKABLE GIFT AREA */

.gift-hotspot {
    position: absolute;
    z-index: 3;
    left: 19%;
    top: 28%;
    width: 65%;
    height: 48%;
    border: none;
    background: transparent;
    cursor: pointer;
    border-radius: 20px;
    -webkit-tap-highlight-color: transparent;
}

.gift-hotspot:focus-visible {
    outline: 2px solid white;
    outline-offset: 3px;
}

/* LITTLE HINT */

.tap-message {
    position: absolute;
    z-index: 4;
    bottom: 4%;
    left: 0;
    width: 100%;
    text-align: center;
    color: white;
    font-size: 12px;
    text-shadow: 0 2px 10px #b23e83;
    pointer-events: none;
}

/* OPENING TRANSITION */

.gift-scene.opening .gift-art {
    transform: scale(1.45) rotate(-3deg);
    filter: brightness(1.3) blur(5px);
    opacity: 0;
}

.gift-scene.opening .gift-hotspot {
    pointer-events: none;
}

/* MESSAGE CARD */

.message-card {
    position: absolute;
    z-index: 5;
    width: min(88%, 440px);
    padding: 28px 23px;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -40%) scale(.85);
    opacity: 0;
    pointer-events: none;
    text-align: center;

    border: 1px solid #ffffffaa;
    border-radius: 28px;

    background: linear-gradient(
        145deg,
        #ffffff65,
        #ffcae866
    );

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 15px 45px #a43e7b35,
        inset 0 1px 1px #ffffffaa;

    transition:
        opacity .9s ease,
        transform .9s cubic-bezier(.2,.8,.2,1);
}

.message-card.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
}

.message-card h1 {
    font-size: clamp(23px, 6vw, 32px);
    line-height: 1.4;
    margin-bottom: 15px;
    text-shadow: 0 3px 15px #c64d9180;
}

.message-card p {
    font-size: 13px;
    line-height: 2;
    color: #fffaff;
    font-weight: 500;
}

/* CONTINUE BUTTON */

.continue-btn {
    display: inline-block;
    margin-top: 22px;
    padding: 13px 25px;

    color: #d44b93;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;

    border-radius: 50px;
    border: 1px solid #ffffffcc;

    background: linear-gradient(
        135deg,
        #fff8fd,
        #ffd5eb
    );

    box-shadow: 0 5px 25px #ffffff60;

    opacity: 0;
    transform: translateY(15px);
    pointer-events: none;

    transition: opacity .7s ease, transform .7s ease;
}

.continue-btn.show {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    animation: glow 1.8s infinite alternate;
}

@keyframes glow {
    from {
        box-shadow: 0 5px 18px #ffffff60;
    }
    to {
        box-shadow: 0 5px 28px #ffffffdd, 0 0 20px #ff9dd2;
    }
}

/* FLOATING HEARTS */

.heart {
    position: fixed;
    bottom: -30px;
    z-index: 8;
    pointer-events: none;
    animation: floatHeart 3s ease-out forwards;
    filter: drop-shadow(0 0 8px #ffffff80);
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) rotate(0deg) scale(.7);
        opacity: 0;
    }
    20% {
        opacity: 1;
    }
    100% {
        transform: translateY(-100svh) rotate(35deg) scale(1.3);
        opacity: 0;
    }
}

@keyframes sceneAppear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* MOBILE */

@media (max-width: 480px) {
    .page {
        padding: 12px;
    }

    .gift-scene {
        width: 100%;
        max-height: 82svh;
    }

    .message-card {
        padding: 23px 18px;
    }

    .message-card p {
        font-size: 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<main class="page">

    <div class="gift-scene" id="giftScene">

        <img
            class="gift-art"
            src="a_dreamy_pastel_pink_glittery_magical_birthday.png"
            alt="A beautiful pink birthday gift for Britikaa"
        >

        <button
            class="gift-hotspot"
            id="giftButton"
            aria-label="Open your birthday surprise"
        ></button>

        <div class="tap-message" id="tapMessage">
            Tap the gift to open 💗
        </div>

    </div>

    <section class="message-card" id="messageCard">

        <h1>Happy Birthday, Britiii! 🎂</h1>

        <p>
            Happy 9teen fuchiii 💋<br>

            You deserve all the happiness, love and magic
            in this world. Keep shining, birthday girl! ✨<br>

            Now this is the last teen year you got,
            so live it to the fullest 😘
        </p>

        <a href="page2.html" class="continue-btn" id="continueBtn">
            Continue to the next surprise 💗 →
        </a>

    </section>

</main>

<script>
const giftScene = document.getElementById("giftScene");
const giftButton = document.getElementById("giftButton");
const messageCard = document.getElementById("messageCard");
const continueBtn = document.getElementById("continueBtn");
const tapMessage = document.getElementById("tapMessage");

let opened = false;

function createHearts() {
    const symbols = ["💗", "💕", "✨", "💖", "♡"];

    for (let i = 0; i < 24; i++) {
        setTimeout(() => {
            const heart = document.createElement("span");

            heart.className = "heart";
            heart.textContent =
                symbols[Math.floor(Math.random() * symbols.length)];

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (12 + Math.random() * 18) + "px";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 3200);
        }, i * 100);
    }
}

function openGift() {
    if (opened) return;

    opened = true;

    giftScene.classList.add("opening");
    tapMessage.style.opacity = "0";

    createHearts();

    setTimeout(() => {
        messageCard.classList.add("show");
    }, 650);

    setTimeout(() => {
        continueBtn.classList.add("show");
    }, 1700);
}

giftButton.addEventListener("click", openGift);
</script>

</body>
</html>
